<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drom Filter - Поиск автомобилей</title>
    
    <!-- Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- React 18 -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel для JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #eff6ff 0%, #e0e7ff 100%);
        }
        
        .gradient-header {
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
        }
        
        .gradient-button {
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
        }
        
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        .button-primary {
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .button-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        
        .button-secondary {
            background: #f3f4f6;
            color: #374151;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .button-secondary:hover {
            background: #e5e7eb;
        }
        
        .select-style {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            background: white;
            font-size: 16px;
        }
        
        .select-style:focus {
            outline: none;
            border-color: #2563eb;
        }
        
        .input-style {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            background: white;
            font-size: 16px;
        }
        
        .input-style:focus {
            outline: none;
            border-color: #2563eb;
        }
        
        .multi-select-button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin: 4px;
        }
        
        .multi-select-button.selected {
            background: #2563eb;
            color: white;
        }
        
        .multi-select-button:not(.selected) {
            background: #f3f4f6;
            color: #374151;
        }
        
        .multi-select-button:not(.selected):hover {
            background: #e5e7eb;
        }
        
        .quick-button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            background: #f3f4f6;
            color: #374151;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin: 4px;
        }
        
        .quick-button:hover {
            background: #dbeafe;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState } = React;
        
        function DromFilterApp() {
            const [filters, setFilters] = useState({
                brand: '',
                model: '',
                yearFrom: '',
                yearTo: '',
                priceFrom: '',
                priceTo: '',
                region: '',
                bodyType: [],
                transmission: [],
                driveType: [],
                fuelType: [],
                color: []
            });
            
            // База данных автомобилей
            const carDatabase = {
                'Toyota': ['Camry', 'Corolla', 'RAV4', 'Land Cruiser', 'Highlander', 'Crown', 'Mark II', 'Chaser', 'Cresta', 'Premio', 'Allion', 'Vitz', 'Prius', 'Alphard', 'Vellfire', 'Harrier'],
                'Nissan': ['X-Trail', 'Qashqai', 'Teana', 'Patrol', 'Murano', 'Juke', 'Note', 'Tiida', 'Almera', 'Sylphy', 'Bluebird', 'Sunny', 'AD', 'Wingroad', 'Serena', 'Elgrand'],
                'Honda': ['CR-V', 'Civic', 'Accord', 'Fit', 'HR-V', 'Pilot', 'Odyssey', 'Stream', 'Stepwgn', 'Freed', 'Vezel', 'Shuttle'],
                'Mazda': ['CX-5', 'Mazda3', 'Mazda6', 'CX-3', 'CX-7', 'CX-9', 'Demio', 'Axela', 'Atenza', 'Premacy', 'MPV', 'Biante'],
                'Mitsubishi': ['Outlander', 'ASX', 'Pajero', 'L200', 'Lancer', 'Eclipse Cross', 'Delica', 'RVR', 'Galant', 'Montero Sport'],
                'Subaru': ['Forester', 'Outback', 'XV', 'Impreza', 'Legacy', 'Levorg', 'Exiga', 'Tribeca'],
                'BMW': ['X5', 'X3', 'X1', '3 серии', '5 серии', '7 серии', 'X6', 'X4', 'X7', '1 серии', '2 серии', '4 серии'],
                'Mercedes-Benz': ['E-класс', 'C-класс', 'S-класс', 'GLE', 'GLC', 'GLA', 'GLK', 'ML', 'GL', 'A-класс', 'B-класс', 'CLS'],
                'Audi': ['Q5', 'Q7', 'A4', 'A6', 'Q3', 'A3', 'Q8', 'A5', 'A7', 'A8', 'Q2'],
                'Volkswagen': ['Tiguan', 'Touareg', 'Passat', 'Polo', 'Jetta', 'Golf', 'Touran', 'Caddy', 'Multivan'],
                'Hyundai': ['Solaris', 'Creta', 'Tucson', 'Santa Fe', 'Elantra', 'Sonata', 'i30', 'i40', 'ix35', 'Grand Starex'],
                'Kia': ['Rio', 'Sportage', 'Sorento', 'Ceed', 'Optima', 'Soul', 'Picanto', 'Seltos', 'Mohave', 'Carnival'],
                'Chevrolet': ['Cruze', 'Aveo', 'Lacetti', 'Captiva', 'Tahoe', 'Suburban', 'Camaro', 'Corvette', 'Silverado'],
                'Ford': ['Focus', 'Mondeo', 'Kuga', 'Explorer', 'EcoSport', 'Fiesta', 'Fusion', 'Escape', 'Edge', 'Expedition'],
                'Lexus': ['RX', 'NX', 'LX', 'IS', 'ES', 'GX', 'LS', 'CT', 'GS', 'UX']
            };
            
            const brands = Object.keys(carDatabase).sort();
            const models = filters.brand ? carDatabase[filters.brand] : [];
            
            const bodyTypes = ['Седан', 'Хэтчбек', 'Универсал', 'Внедорожник', 'Кроссовер', 'Купе', 'Минивэн', 'Пикап', 'Лифтбек', 'Фургон'];
            const transmissions = ['Механика', 'Автомат', 'Робот', 'Вариатор'];
            const driveTypes = ['Передний', 'Задний', 'Полный'];
            const fuelTypes = ['Бензин', 'Дизель', 'Гибрид', 'Электро', 'Газ', 'Газ-бензин'];
            const colors = ['Белый', 'Черный', 'Серый', 'Серебристый', 'Красный', 'Синий', 'Зеленый', 'Коричневый', 'Желтый', 'Оранжевый', 'Бежевый', 'Золотистый'];
            const regions = ['Москва', 'Санкт-Петербург', 'Владивосток', 'Новосибирск', 'Екатеринбург', 'Казань', 'Нижний Новгород', 'Челябинск', 'Самара', 'Омск', 'Ростов-на-Дону', 'Уфа', 'Красноярск', 'Пермь', 'Воронеж', 'Волгоград'];
            
            const priceRanges = [
                { label: 'До 300 тыс', from: '', to: '300000' },
                { label: '300-500 тыс', from: '300000', to: '500000' },
                { label: '500-700 тыс', from: '500000', to: '700000' },
                { label: '700 тыс - 1 млн', from: '700000', to: '1000000' },
                { label: '1-1.5 млн', from: '1000000', to: '1500000' },
                { label: '1.5-2 млн', from: '1500000', to: '2000000' },
                { label: 'От 2 млн', from: '2000000', to: '' }
            ];
            
            const yearRanges = [
                { label: 'С 2020', from: '2020', to: '' },
                { label: '2015-2020', from: '2015', to: '2020' },
                { label: '2010-2015', from: '2010', to: '2015' },
                { label: '2005-2010', from: '2005', to: '2010' },
                { label: 'До 2005', from: '', to: '2005' }
            ];
            
            const handleChange = (field, value) => {
                setFilters(prev => ({ 
                    ...prev, 
                    [field]: value,
                    ...(field === 'brand' && { model: '' })
                }));
            };
            
            const handleMultiSelect = (field, value) => {
                setFilters(prev => {
                    const current = prev[field];
                    const updated = current.includes(value)
                        ? current.filter(item => item !== value)
                        : [...current, value];
                    return { ...prev, [field]: updated };
                });
            };
            
            const setPriceRange = (from, to) => {
                setFilters(prev => ({ ...prev, priceFrom: from, priceTo: to }));
            };
            
            const setYearRange = (from, to) => {
                setFilters(prev => ({ ...prev, yearFrom: from, yearTo: to }));
            };
            
            const handleSearch = () => {
                const activeFilters = Object.entries(filters)
                    .filter(([_, value]) => value && (Array.isArray(value) ? value.length > 0 : true))
                    .map(([key, value]) => `${key}: ${Array.isArray(value) ? value.join(', ') : value}`)
                    .join('\n');
                
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.showAlert('Поиск запущен! Найдено объявлений: ' + Math.floor(Math.random() * 500));
                } else {
                    alert(`Поиск запущен!\n\nПримененные фильтры:\n${activeFilters || 'Нет активных фильтров'}`);
                }
            };
            
            const resetFilters = () => {
                setFilters({
                    brand: '',
                    model: '',
                    yearFrom: '',
                    yearTo: '',
                    priceFrom: '',
                    priceTo: '',
                    region: '',
                    bodyType: [],
                    transmission: [],
                    driveType: [],
                    fuelType: [],
                    color: []
                });
            };
            
            return (
                <div style={{ minHeight: '100vh', paddingBottom: '100px' }}>
                    {/* Header */}
                    <div className="gradient-header text-white p-4 shadow-lg" style={{ position: 'sticky', top: 0, zIndex: 50 }}>
                        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', maxWidth: '1200px', margin: '0 auto' }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                                <div style={{ fontSize: '24px' }}>🚗</div>
                                <h1 style={{ fontSize: '24px', fontWeight: 'bold', margin: 0 }}>Дром</h1>
                            </div>
                            <div style={{ fontSize: '14px', background: 'rgba(255,255,255,0.2)', padding: '4px 12px', borderRadius: '20px' }}>
                                700,000+ авто
                            </div>
                        </div>
                    </div>
                    
                    <div style={{ maxWidth: '1200px', margin: '0 auto', padding: '16px' }}>
                        {/* Марка и модель */}
                        <div className="card" style={{ padding: '24px', marginBottom: '16px' }}>
                            <h2 style={{ fontSize: '20px', fontWeight: 'bold', color: '#1f2937', marginBottom: '16px', display: 'flex', alignItems: 'center', gap: '8px' }}>
                                🔍 Марка и модель
                            </h2>
                            
                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '16px' }}>
                                <div>
                                    <label style={{ display: 'block', fontSize: '14px', fontWeight: '600', color: '#374151', marginBottom: '8px' }}>Марка</label>
                                    <select 
                                        value={filters.brand}
                                        onChange={(e) => handleChange('brand', e.target.value)}
                                        className="select-style"
                                    >
                                        <option value="">Все марки</option>
                                        {brands.map(brand => (
                                            <option key={brand} value={brand}>{brand}</option>
                                        ))}
                                    </select>
                                </div>
                                
                                <div>
                                    <label style={{ display: 'block', fontSize: '14px', fontWeight: '600', color: '#374151', marginBottom: '8px' }}>Модель</label>
                                    <select
                                        value={filters.model}
                                        onChange={(e) => handleChange('model', e.target.value)}
                                        disabled={!filters.brand}
                                        className="select-style"
                                        style={{ opacity: !filters.brand ? 0.5 : 1 }}
                                    >
                                        <option value="">Все модели</option>
                                        {models.map(model => (
                                            <option key={model} value={model}>{model}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        {/* Год выпуска */}
                        <div className="card" style={{ padding: '24px', marginBottom: '16px' }}>
                            <h2 style={{ fontSize: '20px', fontWeight: 'bold', color: '#1f2937', marginBottom: '16px', display: 'flex', alignItems: 'center', gap: '8px' }}>
                                📅 Год выпуска
                            </h2>
                            
                            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px', marginBottom: '16px' }}>
                                {yearRanges.map(range => (
                                    <button
                                        key={range.label}
                                        onClick={() => setYearRange(range.from, range.to)}
                                        className="quick-button"
                                    >
                                        {range.label}
                                    </button>
                                ))}
                            </div>
                            
                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))', gap: '16px' }}>
                                <div>
                                    <label style={{ display: 'block', fontSize: '14px', fontWeight: '600', color: '#374151', marginBottom: '8px' }}>От</label>
                                    <select
                                        value={filters.yearFrom}
                                        onChange={(e) => handleChange('yearFrom', e.target.value)}
                                        className="select-style"
                                    >
                                        <option value="">Любой</option>
                                        {Array.from({length: 35}, (_, i) => 2025 - i).map(year => (
                                            <option key={year} value={year}>{year}</option>
                                        ))}
                                    </select>
                                </div>
                                <div>
                                    <label style={{ display: 'block', fontSize: '14px', fontWeight: '600', color: '#374151', marginBottom: '8px' }}>До</label>
                                    <select
                                        value={filters.yearTo}
                                        onChange={(e) => handleChange('yearTo', e.target.value)}
                                        className="select-style"
                                    >
                                        <option value="">Любой</option>
                                        {Array.from({length: 35}, (_, i) => 2025 - i).map(year => (
                                            <option key={year} value={year}>{year}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        {/* Цена */}
                        <div className="card" style={{ padding: '24px', marginBottom: '16px' }}>
                            <h2 style={{ fontSize: '20px', fontWeight: 'bold', color: '#1f2937', marginBottom: '16px', display: 'flex', alignItems: 'center', gap: '8px' }}>
                                💰 Цена, ₽
                            </h2>
                            
                            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px', marginBottom: '16px' }}>
                                {priceRanges.map(range => (
                                    <button
                                        key={range.label}
                                        onClick={() => setPriceRange(range.from, range.to)}
                                        className="quick-button"
                                    >
                                        {range.label}
                                    </button>
                                ))}
                            </div>
                            
                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))', gap: '16px' }}>
                                <div>
                                    <label style={{ display: 'block', fontSize: '14px', fontWeight: '600', color: '#374151', marginBottom: '8px' }}>От</label>
                                    <input
                                        type="number"
                                        placeholder="100000"
                                        value={filters.priceFrom}
                                        onChange={(e) => handleChange('priceFrom', e.target.value)}
                                        className="input-style"
                                    />
                                </div>
                                <div>
                                    <label style={{ display: 'block', fontSize: '14px', fontWeight: '600', color: '#374151', marginBottom: '8px' }}>До</label>
                                    <input
                                        type="number"
                                        placeholder="5000000"
                                        value={filters.priceTo}
                                        onChange={(e) => handleChange('priceTo', e.target.value)}
                                        className="input-style"
                                    />
                                </div>
                            </div>
                        </div>
                        
                        {/* Регион */}
                        <div className="card" style={{ padding: '24px', marginBottom: '16px' }}>
                            <h2 style={{ fontSize: '20px', fontWeight: 'bold', color: '#1f2937', marginBottom: '16px', display: 'flex', alignItems: 'center', gap: '8px' }}>
                                📍 Регион
                            </h2>
                            <select 
                                value={filters.region}
                                onChange={(e) => handleChange('region', e.target.value)}
                                className="select-style"
                            >
                                <option value="">Все регионы</option>
                                {regions.map(region => (
                                    <option key={region} value={region}>{region}</option>
                                ))}
                            </select>
                        </div>
                        
                        {/* Тип кузова */}
                        <div className="card" style={{ padding: '24px', marginBottom: '16px' }}>
                            <h2 style={{ fontSize: '20px', fontWeight: 'bold', color: '#1f2937', marginBottom: '16px' }}>Тип кузова</h2>
                            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px' }}>
                                {bodyTypes.map(type => (
                                    <button
                                        key={type}
                                        onClick={() => handleMultiSelect('bodyType', type)}
                                        className={`multi-select-button ${filters.bodyType.includes(type) ? 'selected' : ''}`}
                                    >
                                        {type}
                                    </button>
                                ))}
                            </div>
                        </div>
                        
                        {/* Технические характеристики */}
                        <div className="card" style={{ padding: '24px', marginBottom: '16px' }}>
                            <h2 style={{ fontSize: '20px', fontWeight: 'bold', color: '#1f2937', marginBottom: '16px', display: 'flex', alignItems: 'center', gap: '8px' }}>
                                ⚙️ Технические характеристики
                            </h2>
                            
                            <div style={{ display: 'flex', flexDirection: 'column', gap: '24px' }}>
                                {/* Коробка передач */}
                                <div>
                                    <label style={{ display: 'block', fontSize: '14px', fontWeight: '600', color: '#374151', marginBottom: '8px' }}>Коробка передач</label>
                                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px' }}>
                                        {transmissions.map(trans => (
                                            <button
                                                key={trans}
                                                onClick={() => handleMultiSelect('transmission', trans)}
                                                className={`multi-select-button ${filters.transmission.includes(trans) ? 'selected' : ''}`}
                                            >
                                                {trans}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                
                                {/* Привод */}
                                <div>
                                    <label style={{ display: 'block', fontSize: '14px', fontWeight: '600', color: '#374151', marginBottom: '8px' }}>Привод</label>
                                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px' }}>
                                        {driveTypes.map(drive => (
                                            <button
                                                key={drive}
                                                onClick={() => handleMultiSelect('driveType', drive)}
                                                className={`multi-select-button ${filters.driveType.includes(drive) ? 'selected' : ''}`}
                                            >
                                                {drive}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                
                                {/* Тип топлива */}
                                <div>
                                    <label style={{ display: 'block', fontSize: '14px', fontWeight: '600', color: '#374151', marginBottom: '8px' }}>⛽ Тип топлива</label>
                                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px' }}>
                                        {fuelTypes.map(fuel => (
                                            <button
                                                key={fuel}
                                                onClick={() => handleMultiSelect('fuelType', fuel)}
                                                className={`multi-select-button ${filters.fuelType.includes(fuel) ? 'selected' : ''}`}
                                            >
                                                {fuel}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                
                                {/* Цвет */}
                                <div>
                                    <label style={{ display: 'block', fontSize: '14px', fontWeight: '600', color: '#374151', marginBottom: '8px' }}>Цвет</label>
                                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px' }}>
                                        {colors.map(color => (
                                            <button
                                                key={color}
                                                onClick={() => handleMultiSelect('color', color)}
                                                className={`multi-select-button ${filters.color.includes(color) ? 'selected' : ''}`}
                                            >
                                                {color}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        {/* Info Banner */}
                        <div style={{ background: 'linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%)', borderRadius: '12px', padding: '16px', marginBottom: '16px', border: '2px solid #bbf7d0' }}>
                            <p style={{ color: '#166534', textAlign: 'center', margin: 0 }}>
                                <span style={{ fontWeight: 'bold' }}>Более 700,000 объявлений</span> от частных лиц и автосалонов
                            </p>
                        </div>
                    </div>
                    
                    {/* Fixed Bottom Buttons */}
                    <div style={{ position: 'fixed', bottom: 0, left: 0, right: 0, background: 'white', borderTop: '2px solid #e5e7eb', padding: '16px', boxShadow: '0 -4px 6px -1px rgba(0, 0, 0, 0.1)', zIndex: 40 }}>
                        <div style={{ maxWidth: '1200px', margin: '0 auto', display: 'flex', gap: '12px' }}>
                            <button
                                onClick={resetFilters}
                                className="button-secondary"
                                style={{ flex: 1 }}
                            >
                                Сбросить
                            </button>
                            <button
                                onClick={handleSearch}
                                className="button-primary"
                                style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px' }}
                            >
                                🔍 Показать объявления
                            </button>
                        </div>
                    </div>
                </div>
            );
        }
        
        // Рендер приложения
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<DromFilterApp />);
        
        // Инициализация Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
            tg.setBackgroundColor('#eff6ff');
            tg.setHeaderColor('#2563eb');
        }
    </script>
</body>
</html>
